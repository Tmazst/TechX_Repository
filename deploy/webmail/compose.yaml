services:
  roundcube:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:80"
    environment:
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://mail.eswtn.com
      ROUNDCUBEMAIL_DEFAULT_PORT: "993"
      ROUNDCUBEMAIL_SMTP_SERVER: tls://mail.eswtn.com
      ROUNDCUBEMAIL_SMTP_PORT: "587"
    volumes:
      - roundcube-db:/var/roundcube/db
      - roundcube-app:/var/www/html
      - ./techx.inc.php:/var/roundcube/config/techx.inc.php:ro

volumes:
  roundcube-db:
  roundcube-app:
