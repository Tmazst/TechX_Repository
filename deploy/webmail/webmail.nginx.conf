# Include from the Nginx http context, for example through sites-enabled.
map $request_method $techx_webmail_rate_key {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $techx_webmail_rate_key zone=techx_webmail_post:1m rate=2r/s;

server {
    listen 80;
    server_name webmail.eswtn.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://webmail.eswtn.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name webmail.eswtn.com;

    ssl_certificate /etc/letsencrypt/live/webmail.eswtn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webmail.eswtn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;

    location / {
        limit_req zone=techx_webmail_post burst=12 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8097;
        proxy_set_header Host webmail.eswtn.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
